.hidden{display:none!important}
#staticrypt_content{height:100%}

.pw{position:relative;background:#F3F3F3;border-radius:12px;margin-bottom:12px}
.pw input{width:100%;border:0;background:transparent;font-size:17px;padding:15px 46px 15px 14px;outline:0;border-radius:12px;font-family:inherit}
.pw input:focus{box-shadow:0 0 0 2px #FD5108 inset}
.staticrypt-toggle-password-visibility{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;padding:10px;box-sizing:content-box;opacity:.55;cursor:pointer}
label.staticrypt-remember{display:flex;align-items:center;gap:10px;font-size:14px;color:#464646;margin:4px 2px 16px;text-align:left}

.go{width:100%;border:0;border-radius:12px;background:#000;color:#fff;font-size:16px;font-weight:700;padding:15px;cursor:pointer;font-family:inherit}
.go:active{background:#2D2D2D}
.foot{font-size:11px;color:#7D7D7D;margin-top:16px}
.foot i{display:inline-block;width:18px;height:3px;background:#FD5108;border-radius:2px;vertical-align:middle;margin-right:6px}
